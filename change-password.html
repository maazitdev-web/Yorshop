
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | YourShop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f7fc;
            font-family: 'Poppins', sans-serif;
        }

        .password-container {
            width: 100%;
            max-width: 470px;
            padding: 38px 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(16, 42, 86, .08);
        }

        .logo {
            text-align: center;
            font-size: 29px;
            font-weight: 700;
            color: #102a56;
            margin-bottom: 25px;
        }

        .logo span {
            color: #2563eb;
        }

        .password-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            background: #eaf1ff;
            color: #2563eb;
            border-radius: 50%;
            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #102a56;
            font-size: 23px;
            margin-bottom: 9px;
        }

        .description {
            text-align: center;
            color: #778196;
            font-size: 12px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #102a56;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .password-input {
            position: relative;
        }

        .password-input input {
            width: 100%;
            padding: 13px 75px 13px 14px;
            border: 1px solid #dce3ef;
            border-radius: 7px;
            outline: none;
            font-family: inherit;
            font-size: 13px;
        }

        .password-input input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2563eb;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .password-hint {
            margin-top: 7px;
            color: #8992a3;
            font-size: 10px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .submit-btn:hover {
            background: #102a56;
        }

        #password-message {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .password-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="password-container">

        <div class="logo">
            Your<span>Shop</span>
        </div>

        <div class="password-icon">🔐</div>

        <h1>Change Password</h1>

        <p class="description">
            Create a new password to help keep your YourShop account secure.
        </p>

        <form id="change-password-form">

            <div class="form-group">
                <label for="current-password">Current Password</label>

                <div class="password-input">
                    <input
                        type="password"
                        id="current-password"
                        placeholder="Enter current password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button"
                            class="toggle-password"
                            data-target="current-password">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="new-password">New Password</label>

                <div class="password-input">
                    <input
                        type="password"
                        id="new-password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                    <button type="button"
                            class="toggle-password"
                            data-target="new-password">
                        Show
                    </button>
                </div>

                <p class="password-hint">
                    Password must contain at least 8 characters.
                </p>
            </div>

            <div class="form-group">
                <label for="confirm-new-password">Confirm New Password</label>

                <div class="password-input">
                    <input
                        type="password"
                        id="confirm-new-password"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                    <button type="button"
                            class="toggle-password"
                            data-target="confirm-new-password">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                Update Password
            </button>

            <p id="password-message" role="status" aria-live="polite"></p>

        </form>

        <a href="./customer-dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>

    </main>

    <script src="./js/change-password.js"></script>

</body>
</html>
