
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YourShop Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f6ff;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(16, 42, 86, 0.10);
        }

        .logo {
            text-align: center;
            color: #102a56;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #102a56;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #102a56;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #15803d;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1 class="logo">YourShop</h1>

        <p class="subtitle">Administrator Login</p>

        <form id="admin-login-form">

            <div class="form-group">
                <label for="admin-email">Email Address</label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="login-button">
                Login to Dashboard
            </button>

            <p id="login-message" class="message"></p>

        </form>

    </div>

    <script>
        const API_URL = "http://localhost:3000/api/admin/login";

        const form = document.getElementById("admin-login-form");
        const message = document.getElementById("login-message");
        const loginButton = document.getElementById("login-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("admin-email").value.trim();
            const password = document.getElementById("admin-password").value;

            message.textContent = "";
            message.className = "message";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success || !data.token) {
                    throw new Error(data.message || "Login failed.");
                }

                sessionStorage.setItem(
                    "yourshop-admin-token",
                    data.token
                );

                message.textContent = "Login successful! Redirecting...";
                message.classList.add("success");

                window.location.href = "./admin.html";

            } catch (error) {
                message.textContent = error.message;
                message.classList.add("error");

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login to Dashboard";
            }
        });
    </script>

</body>
</html>
