
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | YourShop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f7fc;
        }

        .forgot-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 40px 35px;
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(16, 42, 86, 0.08);
        }

        .logo {
            text-align: center;
            color: #102a56;
            font-size: 29px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .logo span {
            color: #2563eb;
        }

        .forgot-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            background: #eaf1ff;
            color: #2563eb;
            border-radius: 50%;
            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #102a56;
            font-size: 23px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #778196;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #102a56;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce3ef;
            border-radius: 7px;
            outline: none;
            font-family: inherit;
            font-size: 13px;
            transition: .2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .submit-btn:hover {
            background: #102a56;
        }

        #forgot-message {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .back-store {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #8992a3;
            text-decoration: none;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .forgot-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="forgot-container">

        <div class="logo">
            Your<span>Shop</span>
        </div>

        <div class="forgot-icon">🔐</div>

        <h1>Forgot Password?</h1>

        <p class="description">
            Don't worry! Enter the email address associated with your
            account. We'll help you recover access to your account.
        </p>

        <form id="forgot-password-form">

            <div class="form-group">
                <label for="forgot-email">Email Address</label>

                <input
                    type="email"
                    id="forgot-email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Reset Password
            </button>

            <p id="forgot-message" role="status" aria-live="polite"></p>

        </form>

        <a href="./customer-login.html" class="back-login">
            ← Back to Login
        </a>

        <a href="./index.html" class="back-store">
            Return to YourShop
        </a>

    </main>

    <script src="./js/forgot-password.js"></script>

</body>
</html>
